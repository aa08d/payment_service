[mypy]
python_version = 3.14
mypy_path = src
packages = payment
strict = True
warn_unreachable = True
enable_error_code = ignore-without-code, redundant-expr, truthy-bool

[mypy-payment.domain.payment.entities.payment]
disable_error_code = arg-type

[mypy-payment.infrastructure.database.models.*]
disable_error_code = arg-type, assignment, misc, attr-defined

[mypy-payment.infrastructure.database.migrations.*]
ignore_errors = True
