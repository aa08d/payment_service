[project]
name = "payment"
version = "0.1.0"
description = "Service skeleton: domain/application common code, mediator, DI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "adaptix>=3.0.0b12",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "dishka>=1.10.1",
    "fastapi>=0.162.0",
    "faststream[rabbit]>=0.7.8",
    "httpx>=0.28.1",
    "orjson>=3.13.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "testcontainers[postgres]>=4.15.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=2.4.1",
    "pre-commit>=4.0.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
