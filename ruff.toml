line-length = 120
target-version = "py314"
src = ["src", "tests"]

[format]
quote-style = "double"
docstring-code-format = true

[lint]
select = [
    "E", "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "RET",
    "PIE",
    "PT",
    "ASYNC",
    "RUF",
    "T20",
    "TID",
    "PERF",
]
ignore = [
    "B024",
    "RUF001", "RUF002", "RUF003",
    "RET505",
]

[lint.per-file-ignores]
"tests/**" = ["B018"]

[lint.isort]
known-first-party = ["payment", "tests"]

[lint.flake8-tidy-imports]
ban-relative-imports = "parents"
