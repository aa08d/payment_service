[api]
api_key = "dev-secret-key"
host = "0.0.0.0"
port = 8000

[db]
host = "postgres"
port = 5432
database = "payment"
user = "payment"
password = "payment"

[rabbit]
host = "rabbitmq"
port = 5672
user = "guest"
password = "guest"
vhost = "/"

[consumer]
prefetch_count = 10
max_attempts = 3
retry_base_delay_seconds = 2

[gateway]
min_delay_seconds = 2.0
max_delay_seconds = 5.0
success_rate = 0.9

[webhook]
timeout_seconds = 5.0

[outbox]
poll_interval_seconds = 1.0
batch_size = 100
